<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${page.lesson.title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main class="container reading">
    <p class="eyebrow"><a th:href="@{/}">学习路线</a> / <span th:text="${page.lesson.track.label}"></span></p>
    <h1 th:text="${page.lesson.title}"></h1>
    <p class="lede" th:text="${page.lesson.objective}"></p>
    <section class="card">
        <h2>知识要点</h2>
        <p th:text="${page.body}"></p>
        <h3>代码示例</h3>
        <pre><code th:text="${page.example}"></code></pre>
        <div th:if="${page.lesson.id == 'fetch-demo'}" class="demo" id="fetch-demo">
            <h3>动手联调</h3>
            <div class="actions">
                <button type="button" th:data-url="@{/api/lessons/java-core}">发起成功请求</button>
                <button type="button" class="secondary" th:data-url="@{/api/lessons/missing}">发起 404 请求</button>
            </div>
            <pre id="demo-status" role="status">选择一个请求，查看响应。</pre>
            <script th:src="@{/fetch-demo.js}" defer></script>
        </div>
    </section>
    <section>
        <h2 class="section-title">课后练习</h2>
        <p>每题只有一个正确选项，提交后查看解析。</p>
        <form method="post" th:action="@{/lessons/{id}/attempts(id=${page.lesson.id})}">
            <p class="error" role="alert" th:if="${formError}" th:text="${formError}"></p>
            <fieldset class="card question" th:each="question, iteration : ${page.questions}">
                <legend th:text="${iteration.count} + '. ' + ${question.text}"></legend>
                <label class="option" th:each="option : ${question.options}">
                    <input type="radio" required th:name="'answer-' + ${question.id}" th:value="${option.key}"
                           th:checked="${selections != null and selections['answer-' + question.id] == option.key}">
                    <span th:text="${option.key} + '. ' + ${option.label}"></span>
                </label>
            </fieldset>
            <button type="submit">提交并查看解析</button>
        </form>
    </section>
</main>
</body>
</html>
